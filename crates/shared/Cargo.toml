[package]
name = "shared"
version = "0.1.1"
edition = "2021"
resolver = "2"

[features]
# 2026-11-10: 試験のビルドだけで使う。利用者のデータの置き場 (app_data_dir) を、本物の %APPDATA% ではなく一時フォルダにする
# (IME 本体の試験が dev-dependencies で入れる。配る版の組み立てでは入らない)
test-data-root = []

[dependencies]
prost = "0.13.4"
tonic = "0.12.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tonic-build = "0.12.3"

[dependencies.windows]
version = "0.58.0"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    # 2026-11-04: 単語登録の読み込みで Shift-JIS のファイルを読む (MultiByteToWideChar)
    "Win32_Globalization",
    # 2026-11-10: 変換サーバーが落ちたときの報告にヒープを入れない (WerSetFlags。winsec::exclude_heap_from_error_reports)
    "Win32_System_ErrorReporting",
]
