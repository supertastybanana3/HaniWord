[package]
name = "azookey-server"
version = "0.1.1"
edition = "2021"
resolver = "2"

[features]
security-probe = []

[dependencies]
tokio = { version = "1.42.0", features = ["full"] }
tonic = "0.12.3"
tonic-reflection = "0.12.3"
shared = { path = "../shared" }
async-stream = "0.3.6"
futures-core = "0.3.31"

[dev-dependencies]
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.4", features = ["util"] }

[dependencies.windows]
version = "0.58.0"
features = [
    "Win32_Security_Authorization",
]
